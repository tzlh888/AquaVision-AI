   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203348" x="22.1544" y="31.250959" transform="rotate(-0 22.1544 31.250959)">AquaVision AI</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616f" x="22.1544" y="58.812885" transform="rotate(-0 22.1544 58.812885)">Predictive ability and reliability across geographically unseen regions</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203348" x="39.35196" y="99.284085" transform="rotate(-0 39.35196 99.284085)">Paired satellite observations</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(39.35196 123.653245)">Sentinel-2: 12 × 64 × 64 bands</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(39.35196 137.684495)">CyAN-derived mask: 64 × 64</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(39.35196 152.684495)">Low / Moderate / High; ignore flags</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203348" x="289.83816" y="99.284085" transform="rotate(-0 289.83816 99.284085)">Pixel-level segmentation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(289.83816 122.684495)">Spectral indices · LR · RF</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(289.83816 137.684495)">SmallSegCNN · DeepLabV3</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(289.83816 152.684495)">Train-only preprocessing</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203348" x="544.06296" y="99.284085" transform="rotate(-0 544.06296 99.284085)">Evaluation discipline</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(544.06296 123.653245)">Validation selection locked</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(544.06296 137.684495)">Macro F1 → High F1 + class guard</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(544.06296 153.653245)">No Test-based model choice</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203348" x="61.78356" y="208.556325" transform="rotate(-0 61.78356 208.556325)">Random vs geographic pilot</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(61.78356 231.956735)">Same 272-pair pool, two split strategies</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(61.78356 246.956735)">Neither Test partition contains High</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(61.78356 262.925485)">Pilot cannot establish three-class transfer</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203348" x="435.64356" y="208.556325" transform="rotate(-0 435.64356 208.556325)">Frozen geographic benchmark v2</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(435.64356 231.956735)">288 pairs: 96 Train / 48 Validation / 144 Test</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(435.64356 246.956735)">3 held-out regions · 37,768 High Test pixels</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(435.64356 261.956735)">Class support repaired before model comparison</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203348" x="61.78356" y="336.040605" transform="rotate(-0 61.78356 336.040605)">Reliability analysis</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(61.78356 359.441015)">Regional failures · class imbalance · calibration</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(61.78356 374.441015)">Multispectral perturbations · band ablation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(61.78356 389.441015)">Segmentation-targeted attribution</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203348" x="435.64356" y="336.040605" transform="rotate(-0 435.64356 336.040605)">LIMITED evidence</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(435.64356 359.441015)">Predictive signal exists; stable three-class</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(435.64356 374.441015)">geographic generalization is not established.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #344454" transform="translate(435.64356 389.441015)">Selected NDCI: validation High F1 = 0.</text>
   </g>
  </g>
 </g>
