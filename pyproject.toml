[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aquavision-ai"
version = "0.1.0"
description = "Research infrastructure for geographic generalization of CyAN-derived bloom indicators"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "matplotlib==3.11.2", "PyYAML==6.0.3", "requests==2.34.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
training = ["scikit-learn==1.9.1", "torch==2.14.1", "torchvision==0.29.1", "segmentation-models-pytorch==0.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
